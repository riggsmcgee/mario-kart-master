# GitHub Pages deploy. (1a5)
#
# Deferred since 2026-08-06 while everything ran on localhost; picked up now that there is a
# course worth looking at. Vite's `base` has been Pages-correct since 1a1, so this is the one
# file that was missing.
#
# This build takes no secrets and reaches nothing at runtime. It used to inject two Supabase
# values for the sign-in; that was removed on 2026-08-14 and the repository secrets that fed it
# can be deleted. The site is now static all the way down, and progress lives in localStorage.

name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  # So a deploy can be re-run without an empty commit.
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Let a run finish rather than cancelling it: a half-deployed Pages site is worse than a slightly
# stale one.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      # Typecheck and lint before building. A deploy is the worst place to find out the build
      # was broken, and these take seconds.
      - run: npm run typecheck
      - run: npm run lint

      - run: npm run build

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
