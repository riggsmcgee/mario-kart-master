<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light" />
    <title>Beat Kayla at Mario Kart</title>
    <meta
      name="description"
      content="A short course for Jodi: eight things that win Mario Kart races, and a practice plan for the Switch."
    />
    <!-- Not a public page. It is a present with a link, and it has no business in search results. -->
    <meta name="robots" content="noindex, nofollow" />
  </head>
  <body>
    <!--
      Keyboard is her only input device, so the skip link is not a formality. It is also the very
      first thing in the tab order, which is why the `onclick` matters more than it looks: this is a
      hash-routed app, so following `href="#main"` for real sets the hash to `#main`, which
      `parseHash` reads as a wrong turn and replaces the whole page with "There is no chapter here".
      The one control on the site aimed squarely at a keyboard user was the one control that broke
      it. So the click is cancelled and focus is moved by hand; `href` stays for the affordance and
      for anyone whose scripting is off, where landing on `#main` at least does no harm.
    -->
    <a
      href="#main"
      style="
        position: absolute;
        left: -9999px;
        top: 0;
        background: #fff;
        padding: 0.8em 1.2em;
        z-index: 100;
      "
      onfocus="this.style.left = '1rem'"
      onblur="this.style.left = '-9999px'"
      onclick="
        event.preventDefault();
        var m = document.getElementById('main');
        if (m) {
          m.focus();
          m.scrollIntoView();
        }
      "
      >Skip to the chapter</a
    >
    <div id="app"></div>
    <script type="module" src="/src/site/main.ts"></script>
  </body>
</html>
